name: CICD
"on":
  workflow_dispatch: null
jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        run: echo "Hi, this is clone"
  build:
    runs-on: ubuntu-latest
    needs: code
    steps:
      - name: Build the code
        run: echo "Hi, this is build"
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test the code
        run: echo "Hi, this is test"
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy the code
        run: echo "Hi, this is deploy"
